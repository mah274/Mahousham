<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>روز دختر مبارک 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @property --lb2-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --pink-1: #ffb3d1;
    --pink-2: #ff8fb8;
    --pink-deep: #ff4d6d;
    --purple-1: #c9a4ff;
    --purple-2: #b388eb;
    --blue-1: #a5c8ff;
    --sky: #7dc4ff;
    --sky-deep: #4fa8ff;
    --violet: #9d7dff;
    --violet-deep: #7c5cff;
    --text: #fdf6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    position: relative;
    min-height: 100vh;
    padding: 55px 16px 90px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    /* پس‌زمینه با تاکید آبی آسمونی بالا و بنفش پایین */
    background:
      radial-gradient(1400px 900px at 20% -8%, rgba(125, 196, 255, .58), transparent 62%),
      radial-gradient(1400px 900px at 88% 108%, rgba(157, 125, 255, .58), transparent 62%),
      radial-gradient(1000px 700px at 50% 45%, rgba(150, 180, 255, .22), transparent 72%),
      linear-gradient(168deg, #0e1846 0%, #1d1358 32%, #2c1a72 62%, #100a30 100%);
    font-family: "Baloo Bhaijaan 2", "Vazirmatn", Tahoma, sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ============================================================
     شفق قطبی — پررنگ، آبی آسمونی + بنفش، ۸ لایه
     ============================================================ */
  .aurora {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    opacity: .72;
    transform: translateZ(0);
  }
  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }
  .aurora-blob:nth-child(1) {
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(255, 120, 180, .92), rgba(255, 120, 180, .38) 42%, transparent 74%);
    top: -160px; left: -140px;
    animation: auroraDrift1 22s ease-in-out infinite;
  }
  .aurora-blob:nth-child(2) {
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(157, 125, 255, .92), rgba(157, 125, 255, .40) 42%, transparent 74%);
    top: 22%; right: -180px;
    animation: auroraDrift2 26s ease-in-out infinite;
  }
  .aurora-blob:nth-child(3) {
    width: 580px; height: 580px;
    background: radial-gradient(circle, rgba(125, 196, 255, .92), rgba(125, 196, 255, .40) 42%, transparent 74%);
    bottom: -160px; left: 12%;
    animation: auroraDrift3 30s ease-in-out infinite;
  }
  .aurora-blob:nth-child(4) {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(180, 150, 255, .90), rgba(180, 150, 255, .36) 42%, transparent 74%);
    top: 55%; left: 30%;
    animation: auroraDrift4 24s ease-in-out infinite;
  }
  .aurora-blob:nth-child(5) {
    width: 540px; height: 540px;
    background: radial-gradient(circle, rgba(100, 180, 255, .88), rgba(100, 180, 255, .36) 42%, transparent 74%);
    top: 6%; left: 42%;
    animation: auroraDrift5 28s ease-in-out infinite;
  }
  .aurora-blob:nth-child(6) {
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(200, 160, 255, .90), rgba(200, 160, 255, .36) 42%, transparent 74%);
    bottom: 8%; right: 8%;
    animation: auroraDrift6 32s ease-in-out infinite;
  }
  .aurora-blob:nth-child(7) {
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(130, 210, 255, .85), rgba(130, 210, 255, .34) 42%, transparent 74%);
    top: 70%; right: 30%;
    animation: auroraDrift7 25s ease-in-out infinite;
  }
  .aurora-blob:nth-child(8) {
    width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(170, 140, 255, .88), rgba(170, 140, 255, .34) 42%, transparent 74%);
    top: 40%; left: -60px;
    animation: auroraDrift8 34s ease-in-out infinite;
  }
  @keyframes auroraDrift1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(80px, 100px, 0) scale(1.18); }
  }
  @keyframes auroraDrift2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-110px, -80px, 0) scale(1.22); }
  }
  @keyframes auroraDrift3 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(120px, -90px, 0) scale(1.15); }
  }
  @keyframes auroraDrift4 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-90px, 70px, 0) scale(1.20); }
  }
  @keyframes auroraDrift5 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(60px, 90px, 0) scale(1.24); }
  }
  @keyframes auroraDrift6 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-70px, -60px, 0) scale(1.16); }
  }
  @keyframes auroraDrift7 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-80px, 70px, 0) scale(1.2); }
  }
  @keyframes auroraDrift8 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(90px, -100px, 0) scale(1.18); }
  }

  /* ============================================================
     واترمارک
     ============================================================ */
  .watermark {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    overflow: hidden;
  }

  /* ===== 🧸 خرس ددی — بزرگ، خاص، فقط هاله‌ی گرم ===== */
  .wm-teddy {
    position: absolute;
    font-size: var(--s, 44px);
    line-height: 1;
    opacity: .92;
    animation: teddyFloat ease-in-out infinite;
    filter:
      drop-shadow(0 0 6px rgba(255, 235, 210, .95))
      drop-shadow(0 0 16px rgba(255, 190, 220, .85))
      drop-shadow(0 0 36px rgba(230, 160, 230, .55));
    will-change: transform, opacity;
    transform-origin: center;
  }
  @keyframes teddyFloat {
    0%   { transform: translate3d(0, 0, 0) rotate(-3deg) scale(.94); opacity: .6; }
    30%  { transform: translate3d(7px, -16px, 0) rotate(4deg) scale(1.06); opacity: 1; }
    60%  { transform: translate3d(-10px, -26px, 0) rotate(-4deg) scale(1); opacity: .92; }
    100% { transform: translate3d(0, 0, 0) rotate(-3deg) scale(.94); opacity: .6; }
  }

  /* ===== 🦋 پروانه‌ی اموجی — بزرگ و پرنور ===== */
  .wm-butterfly {
    position: absolute;
    font-size: var(--s, 42px);
    line-height: 1;
    opacity: .88;
    animation: butterflyDance ease-in-out infinite;
    filter:
      drop-shadow(0 0 6px rgba(180, 220, 255, .95))
      drop-shadow(0 0 18px rgba(140, 170, 255, .70))
      drop-shadow(0 0 32px rgba(180, 140, 255, .42));
    will-change: transform, opacity;
    transform-origin: center;
  }
  @keyframes butterflyDance {
    0%   { transform: translate3d(0, 0, 0) rotate(-14deg) scale(.88); opacity: .35; }
    20%  { transform: translate3d(22px, -24px, 0) rotate(12deg) scale(1.10); opacity: .85; }
    45%  { transform: translate3d(-16px, -46px, 0) rotate(-8deg) scale(1.18); opacity: 1; }
    70%  { transform: translate3d(20px, -22px, 0) rotate(14deg) scale(1.06); opacity: .80; }
    100% { transform: translate3d(0, 0, 0) rotate(-14deg) scale(.88); opacity: .35; }
  }

  /* ===== ✨ جرقه‌ی طلایی هرماینی ===== */
  .wm-sparkle {
    position: absolute;
    font-size: var(--s, 20px);
    line-height: 1;
    opacity: .82;
    animation: sparklePop ease-in-out infinite;
    filter:
      drop-shadow(0 0 5px rgba(255, 250, 220, .98))
      drop-shadow(0 0 14px rgba(255, 220, 190, .75))
      drop-shadow(0 0 28px rgba(255, 200, 240, .45));
    will-change: transform, opacity;
    transform-origin: center;
  }
  @keyframes sparklePop {
    0%   { transform: translate3d(0, 0, 0) scale(.55) rotate(0deg); opacity: .15; }
    40%  { transform: translate3d(-6px, -18px, 0) scale(1.25) rotate(120deg); opacity: 1; }
    70%  { transform: translate3d(8px, -10px, 0) scale(1.1) rotate(200deg); opacity: .85; }
    100% { transform: translate3d(0, 0, 0) scale(.55) rotate(360deg); opacity: .15; }
  }

  /* ===== 🌙 ماه — نقره‌ای-یخی ===== */
  .wm-moon {
    position: absolute;
    font-size: var(--s, 22px);
    line-height: 1;
    opacity: .82;
    animation: moonDrift ease-in-out infinite;
    filter:
      drop-shadow(0 0 5px rgba(230, 230, 255, .95))
      drop-shadow(0 0 16px rgba(185, 205, 255, .78))
      drop-shadow(0 0 30px rgba(165, 185, 255, .55));
    will-change: transform, opacity;
  }
  @keyframes moonDrift {
    0%   { transform: translate3d(0, 0, 0) rotate(-5deg) scale(.95); opacity: .4; }
    50%  { transform: translate3d(-10px, -20px, 0) rotate(5deg) scale(1.08); opacity: .95; }
    100% { transform: translate3d(0, 0, 0) rotate(-5deg) scale(.95); opacity: .4; }
  }

  /* ===== 🌹🌷🥀 گل‌های واقعی — رز-سرخ ===== */
  .wm-flower {
    position: absolute;
    font-size: var(--s, 22px);
    line-height: 1;
    opacity: .75;
    animation: flowerSway ease-in-out infinite;
    filter:
      drop-shadow(0 0 4px rgba(255, 210, 220, .95))
      drop-shadow(0 0 12px rgba(255, 170, 200, .70))
      drop-shadow(0 0 26px rgba(230, 140, 190, .42));
    will-change: transform, opacity;
  }
  @keyframes flowerSway {
    0%   { transform: translate3d(0, 0, 0) rotate(-8deg) scale(.9); opacity: .35; }
    50%  { transform: translate3d(6px, -24px, 0) rotate(8deg) scale(1.1); opacity: .9; }
    100% { transform: translate3d(0, 0, 0) rotate(-8deg) scale(.9); opacity: .35; }
  }

  /* ===== 🎀 پاپیون — سرخابی-بنفش ===== */
  .wm-ribbon {
    position: absolute;
    font-size: var(--s, 20px);
    line-height: 1;
    opacity: .72;
    animation: ribbonFlutter ease-in-out infinite;
    filter:
      drop-shadow(0 0 4px rgba(255, 210, 240, .95))
      drop-shadow(0 0 12px rgba(255, 180, 230, .70))
      drop-shadow(0 0 26px rgba(220, 160, 255, .42));
    will-change: transform, opacity;
  }
  @keyframes ribbonFlutter {
    0%   { transform: translate3d(0, 0, 0) rotate(-12deg) scale(.92); opacity: .35; }
    50%  { transform: translate3d(10px, -22px, 0) rotate(12deg) scale(1.1); opacity: .85; }
    100% { transform: translate3d(0, 0, 0) rotate(-12deg) scale(.92); opacity: .35; }
  }

  /* ===== ستاره‌ی جادویی ===== */
  .wm-star {
    position: absolute;
    width: var(--s, 7px);
    height: var(--s, 7px);
    background: radial-gradient(circle, #fff 0%, #e0eeff 45%, #9d7dff 100%);
    clip-path: polygon(
      50% 0%, 61% 35%, 98% 35%, 68% 57%,
      79% 91%, 50% 70%, 21% 91%, 32% 57%,
      2% 35%, 39% 35%
    );
    animation: starTwinkle ease-in-out infinite;
    filter:
      drop-shadow(0 0 5px rgba(220, 235, 255, .95))
      drop-shadow(0 0 12px rgba(140, 170, 255, .70))
      drop-shadow(0 0 20px rgba(160, 130, 255, .45));
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: .08; transform: scale(.4) rotate(0deg); }
    50%      { opacity: .95; transform: scale(1.55) rotate(180deg); }
  }

  /* ===== ذرات جادویی بنفش-آبی ===== */
  .wm-dot {
    position: absolute;
    width: 2.5px; height: 2.5px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
      0 0 6px rgba(180, 220, 255, .98),
      0 0 14px rgba(140, 180, 255, .90),
      0 0 24px rgba(160, 130, 255, .60);
    animation: dotDrift ease-in-out infinite;
  }
  @keyframes dotDrift {
    0%, 100% { transform: translate3d(0, 0, 0); opacity: 0; }
    30%, 70% { opacity: .95; }
    50%      { transform: translate3d(var(--dx, 14px), var(--dy, -26px), 0); opacity: 1; }
  }

  /* ============================================================
     کارت
     ============================================================ */
  .card-container {
    width: min(800px, 100%);
    z-index: 2;
    position: relative;
    animation: rise 1.3s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(38px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card {
    position: relative;
    padding: 48px 42px 46px;
    border-radius: 38px;
    background: rgba(20, 8, 45, .02);
    border: 1px solid rgba(255, 200, 230, .35);
    box-shadow:
      0 30px 90px rgba(15, 4, 38, .40),
      0 0 100px rgba(255, 100, 160, .18),
      inset 0 1px 0 rgba(255, 230, 245, .28);
    overflow: hidden;
    transform: translateZ(0);
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(ellipse at 50% 40%,
      rgba(20, 8, 45, .34),
      rgba(20, 8, 45, .16) 55%,
      transparent 85%);
    pointer-events: none;
    z-index: 0;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -1.5px;
    border-radius: 38px;
    padding: 1.5px;
    background: linear-gradient(120deg,
      #ffb3d1, #c9a4ff, #ff8fb8, #a5c8ff, #ffb3d1, #d1a4ff, #ffb3d1, #ff8fb8);
    background-size: 400% 400%;
    animation: borderShift 14s ease infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: .9;
    z-index: 1;
  }
  @keyframes borderShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ============================================================
     سرتیتر
     ============================================================ */
  .header {
    position: relative;
    z-index: 3;
    text-align: center;
    margin-bottom: 36px;
    padding-bottom: 26px;
    border-bottom: 1.5px dashed rgba(255, 180, 210, .30);
  }

  .title {
    position: relative;
    display: inline-block;
    font-family: "Baloo Bhaijaan 2", "Vazirmatn", Tahoma, sans-serif;
    font-size: clamp(30px, 5.8vw, 48px);
    font-weight: 800;
    line-height: 1.5;
    background: linear-gradient(100deg,
      #ffb3d1, #c9a4ff, #ff8fb8, #a5c8ff, #ffb3d1, #d1a4ff, #ffb3d1);
    background-size: 380% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 130, 190, .70));
    animation: shine 11s linear infinite;
  }
  @keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 380% 50%; }
  }

  .subtitle-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    padding: 10px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg,
      rgba(255, 140, 190, .20),
      rgba(200, 160, 255, .20));
    border: 1.5px solid rgba(255, 180, 220, .55);
    box-shadow:
      0 0 26px rgba(255, 100, 160, .35),
      inset 0 0 18px rgba(255, 190, 220, .16);
    color: #fff2fa;
    font-weight: 700;
    font-size: clamp(13.5px, 2.1vw, 17px);
    letter-spacing: .5px;
    text-shadow: 0 0 14px rgba(255, 120, 170, 1);
  }

  .badge-heart {
    display: inline-block;
    font-size: 1.18em;
    color: #ff4d6d;
    filter: drop-shadow(0 0 10px rgba(255, 60, 110, 1));
    animation: heartBeat 1.6s ease-in-out infinite;
    transform-origin: center;
  }
  .badge-heart:last-child { animation-delay: .8s; }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    22%      { transform: scale(1.22); }
    44%      { transform: scale(1); }
    66%      { transform: scale(1.15); }
    88%      { transform: scale(1); }
  }

  /* ============================================================
     متن
     ============================================================ */
  .content {
    position: relative;
    z-index: 3;
    font-family: "Baloo Bhaijaan 2", "Vazirmatn", Tahoma, sans-serif;
    font-size: clamp(16.5px, 2.05vw, 19px);
    font-weight: 500;
    line-height: 2.1;
    color: var(--text);
    letter-spacing: .1px;
    text-shadow:
      0 1.5px 3px rgba(10, 2, 25, .98),
      0 0 24px rgba(200, 150, 255, .22);
    white-space: normal;
  }
  .content .para {
    margin: 0 0 1.3em;
    text-align: justify;
    text-align-last: right;
    text-justify: inter-word;
  }

  .emo-heart {
    display: inline-block;
    vertical-align: -1px;
    animation: heartPulse 2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }

  .whisper {
    display: block;
    margin-top: 14px;
    text-align: center;
    font-size: .93em;
    font-style: italic;
    color: #e6d4ff;
    opacity: .92;
    text-shadow:
      0 1.5px 3px rgba(10, 2, 25, .98),
      0 0 22px rgba(200, 150, 255, .30);
  }

  /* ============================================================
     بلوک ۱
     ============================================================ */
  .love-box-1 {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 38px auto 24px;
    padding: 26px 32px;
    border-radius: 26px;
    background:
      linear-gradient(135deg,
        rgba(255, 130, 180, .14),
        rgba(200, 140, 255, .12));
    border: 1px solid rgba(255, 180, 220, .48);
    box-shadow:
      0 0 40px rgba(255, 100, 160, .28),
      inset 0 0 28px rgba(255, 190, 220, .10);
    overflow: hidden;
    animation: box1Breathe 5s ease-in-out infinite;
  }
  @keyframes box1Breathe {
    0%, 100% {
      box-shadow:
        0 0 32px rgba(255, 100, 160, .22),
        inset 0 0 22px rgba(255, 190, 220, .08);
      border-color: rgba(255, 180, 220, .42);
    }
    50% {
      box-shadow:
        0 0 55px rgba(255, 100, 160, .45),
        inset 0 0 34px rgba(255, 190, 220, .18);
      border-color: rgba(255, 200, 230, .75);
    }
  }

  .love-box-1::after {
    content: "";
    position: absolute;
    top: 0; left: -80%;
    width: 55%;
    height: 100%;
    background: linear-gradient(100deg,
      transparent,
      rgba(255, 230, 245, .28) 45%,
      rgba(255, 230, 245, .35) 50%,
      rgba(255, 230, 245, .28) 55%,
      transparent);
    transform: skewX(-18deg);
    animation: box1Sweep 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes box1Sweep {
    0%       { left: -80%; opacity: 0; }
    15%      { opacity: 1; }
    55%      { left: 130%; opacity: 1; }
    65%, 100%{ left: 130%; opacity: 0; }
  }

  .love-box-1 .grand-text {
    position: relative;
    z-index: 1;
    font-size: clamp(22px, 4.4vw, 34px);
    font-weight: 800;
    line-height: 1.5;
    color: #ffffff;
    text-align: center;
    letter-spacing: .2px;
    text-shadow:
      0 0 22px rgba(255, 140, 190, .95),
      0 0 44px rgba(255, 100, 160, .60),
      0 1.5px 3px rgba(10, 2, 25, .95);
  }

  /* ============================================================
     بلوک ۲
     ============================================================ */
  .love-box-2 {
    position: relative;
    margin: 52px auto 6px;
    padding: 40px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 34px;
    background:
      radial-gradient(120% 110% at 50% 0%, rgba(160, 200, 255, .14), transparent 62%),
      radial-gradient(120% 110% at 50% 100%, rgba(180, 150, 255, .14), transparent 62%),
      linear-gradient(135deg, rgba(140, 190, 255, .06), rgba(180, 150, 255, .05));
    isolation: isolate;
    overflow: hidden;
    animation: lb2Float 7s ease-in-out infinite;
    transform: translateZ(0);
  }
  @keyframes lb2Float {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50%      { transform: translate3d(0, -5px, 0); }
  }

  .love-box-2::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: conic-gradient(from --lb2-angle,
      #7dc4ff, #9d7dff, #a5c8ff, #dcefff, #7dc4ff, #9d7dff, #a5c8ff, #7dc4ff);

  const letter = `ماهوشم روز دختر، مبارکِ قشنگ‌ترین دختر دنیای من🫠❤️ (البته که هر روز روز توعه🙂‍↔️)

می‌گن ماه برای اینکه زیباییش دیده بشه به نور خورشید نیاز داره ولی تو برای من خودت منبع نور و زیبایی زندگی‌ام شدی🙂❤️ یه جوری قشنگی (منظورم فقط صورت خوشگلت نیستش‌هاااا)، مهربونی‌ات، صبوری‌ات، دلسوزی‌ات، با درک بودنت، اون قلب لطیفت و کلی صفت قشنگ دیگه‌ای که توی وجودت داری، همشون باعث می‌شن هرچی بیشتر می‌شناسمت، بیشتر از قبل دوستت داشته باشم. انگار خدا قشنگ‌ترین صفتاشو برداشته گذاشته توی وجود دخمل کوچولوی من🙂‍↔️❤️

چشم قشنگم دلم نمی‌خواد فقط تماشاگر روزای قشنگت باشم، دلم می‌خواد وقتی از خوشحالی ذوق می‌کنی، منم از دیدن ذوقت ذوق کنم، وقتی خسته‌ای و دلت می‌خواد غر بزنی، با حوصله به حرفات گوش بدم، وقتی یه چیزی اون‌طوری که می‌خواستی پیش نرفته، کنارت بشینم تا با هم ببینیم چطوری می‌شه بهترش کرد. حتی اگه یه روزی نه حوصله درس داشته باشی، نه حوصله حرف زدن، نه حتی بدونی چرا دلت گرفته، دلم می‌خواد بتونی همون‌طوری که هستی کنارم باشی، بدون اینکه لازم باشه وانمود کنی همه‌چی خوبه (این طوری ماهو خودش خوبت می‌کنه)، خلاصه که دلم می‌خواد هم شریک خنده‌هات باشم، هم وقتی دنیا اون‌قدر که باید با کوشولوم مهربون نیست، کنارش باشم تا با هم یه کم قشنگ‌ترش کنیم🙂❤️

ماهوشم، تو یکی از شیرین‌ترین اتفاقای زندگی منی. نه به خاطر اینکه همیشه همه‌چیز قشنگ و بی‌نقصه، به خاطر اینکه خودت با تمام چیزایی که مخصوص خودت هست، برام این‌قدر عزیزی. من نمی‌دونم چطوری باید اندازه‌ی این حس رو توی چند تا جمله جا بدم. فقط می‌دونم هر بار که بهت بگم دوستت دارم، یه عالمه حرف نگفته هم پشتش هست، حرفایی درباره‌ی روزایی که دلم می‌خواد باهات زندگی کنم، جاهایی که دلم می‌خواد باهات ببینم، خاطره‌هایی که دلم می‌خواد با هم بسازیم و لبخندایی که هر بار دیدنشون قراره برای من به اندازه کل دنیا بیارزه🙂

(امروز استثنا هست و مجاز هستم بینهایت بار بگم دوستت دارم🙂‍↔️)`;

  const GRAND_FINAL = 'دوستت دارم مائده بیشتر از چیزی که توی چند تا جمله جا بشه🙃❤️';

  const afterPart  = letter.slice(idx + GRAND_FINAL.length).trim();

  const heartRe = /(❤️|💜|💙|💖|💕|💗|💓|💞)/g;
  function animHearts(t) {
    return t.replace(heartRe, '<span class="emo-heart">$1</span>');
  }

  const beforeWrapped = beforePart
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => `<p class="para">${animHearts(p)}</p>`)
    .join('');

  const loveBox1 = `
    <div class="love-box-1">
      <span class="grand-text">دوستت دارم مائده بیشتر از چیزی که توی چند تا جمله جا بشه🙃❤️</span>
    </div>
  `;

  const loveBox2 = `
    <div class="love-box-2">
      <span class="grand-text">دوستت دارم ماهوشم</span>
    </div>
  `;

  const whisperHTML = afterPart
    ? `<span class="whisper">${animHearts(afterPart)}</span>`
    : '';

  document.getElementById('content').innerHTML =
    beforeWrapped + loveBox1 + whisperHTML + loveBox2;

  const box2 = document.querySelector('.love-box-2');
  if (box2) {
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top  = (Math.random() * 100) + '%';
      s.style.animationDelay    = (Math.random() * 3) + 's';
      s.style.animationDuration = (2.4 + Math.random() * 2) + 's';
      box2.appendChild(s);
    }
  }

  /* ============================================================
     واترمارک
     ============================================================ */
  const wm = document.getElementById('wm');
  const isMobile = window.innerWidth < 700;
  const density = isMobile ? 0.6 : 1;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function stratify(count, min = 0, max = 100) {
    const order = shuffle([...Array(count).keys()]);
    const step = (max - min) / count;
    return order.map(s => {
      const c = min + (s + 0.5) * step;
      const j = (Math.random() - 0.5) * step * 0.6;
      return c + j;
    });
  }

  function placeEmoji(clsName, emoji, yPct, opts = {}) {
    const el = document.createElement('div');
    el.className = clsName;
    el.textContent = emoji;

    let x;
    if (opts.edge === 'left')       x = 2 + Math.random() * 11;
    else if (opts.edge === 'right') x = 87 + Math.random() * 11;
    else                            x = 3 + Math.random() * 94;
    el.style.left = x + '%';

    const yJitter = (Math.random() - 0.5) * (opts.ySpread ?? 4);
    el.style.top = Math.max(1, Math.min(99, yPct + yJitter)) + '%';

    el.style.setProperty('--s', (opts.size ?? 20) + 'px');
    el.style.animationDelay    = (Math.random() * (opts.delayMax ?? 10)) + 's';
    el.style.animationDuration = ((opts.durMin ?? 8) + Math.random() * (opts.durRange ?? 5)) + 's';
    wm.appendChild(el);
  }

  function placeStar(x, y) {
    const el = document.createElement('div');
    el.className = 'wm-star';
    el.style.left = x + '%';
    el.style.top  = y + '%';
    el.style.setProperty('--s', (4 + Math.random() * 5) + 'px');
    el.style.animationDelay    = (Math.random() * 6) + 's';
    el.style.animationDuration = (3 + Math.random() * 4) + 's';
    wm.appendChild(el);
  }

  function placeDot(x, y) {
    const el = document.createElement('div');
    el.className = 'wm-dot';
    el.style.left = x + '%';
    el.style.top  = y + '%';
    el.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
    el.style.setProperty('--dy', (-20 - Math.random() * 30) + 'px');
    el.style.animationDelay    = (Math.random() * 8) + 's';
    el.style.animationDuration = (5 + Math.random() * 5) + 's';
    wm.appendChild(el);
  }

  async function buildWatermark() {
    const fontPromise = (document.fonts && document.fonts.ready)
      ? document.fonts.ready : Promise.resolve();
    await Promise.race([fontPromise, new Promise(r => setTimeout(r, 2000))]);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const paras = document.querySelectorAll('.content .para');
    const totalH = Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight
    );

    const pC = [...paras].map(p => {
      const r = p.getBoundingClientRect();
      const top = r.top + window.scrollY;
      return ((top + r.height / 2) / totalH) * 100;
    });

    /* ---------- نگاشت معنایی پروانه‌ها و خرس ددی روی پاراگراف‌ها ---------- */
    const map = [
      { i: 0,  bf: ['left'],  teddy: ['right'] },   // شروع
      { i: 1,  bf: ['right'], teddy: [] },          // استعاره‌ی ماه
      { i: 2,  bf: ['left'],  teddy: ['right'] },   // بغل، آروم کردن
      { i: 3,  bf: ['right'], teddy: ['left'] },    // قرار خجالت‌آور
      { i: 4,  bf: [],        teddy: ['left','right'] }, // قرارداد گل
      { i: 5,  bf: ['left'],  teddy: ['right'] },   // آینده و خاطره
      { i: 6,  bf: ['right'], teddy: ['left'] },    // لحظه‌های ساده، بغل
      { i: 7,  bf: ['left','right'], teddy: [] },   // خاطره، مسیر
      { i: 8,  bf: ['right'], teddy: ['left'] },    // لبخند، شاخه گل
      { i: 9,  bf: ['left'],  teddy: ['right'] },   // احساس، آینده
      { i: 10, bf: ['right'], teddy: ['left'] },    // روزای قشنگ
      { i: 11, bf: ['left'],  teddy: ['right'] },   // بارون و خجالت
      { i: 12, bf: ['right'], teddy: ['left'] },    // شیرین‌ترین
      { i: 13, bf: ['left','right'], teddy: [] }    // دلیل خنده‌ها
    ];

    map.forEach(m => {
      const y = pC[m.i];
      if (y == null) return;

      // پروانه‌ها — بزرگ و اموجی
      m.bf.forEach(edge => {
        const x = edge === 'left'
          ? 2 + Math.random() * 8
          : 88 + Math.random() * 8;
        const jitter = (Math.random() - 0.5) * 5;
        placeEmoji('wm-butterfly', '🦋', y + jitter, {
          size: 34 + Math.random() * 16,
          durMin: 10, durRange: 6
        });
        const last = wm.lastChild;
        last.style.left = x + '%';
      });

      // خرس ددی — بزرگ و پرنور
      m.teddy.forEach(edge => {
        if (Math.random() > density + 0.1) return;
        const x = edge === 'left'
          ? 3 + Math.random() * 7
          : 88 + Math.random() * 7;
        const jitter = (Math.random() - 0.5) * 4;
        placeEmoji('wm-teddy', '🧸', y + jitter, {
          size: 38 + Math.random() * 16,
          durMin: 9, durRange: 5
        });
        const last = wm.lastChild;
        last.style.left = x + '%';
      });

      // گل‌های واقعی فقط در پاراگراف ۴ (قرارداد گل)
      if (m.i === 4) {
        const flowers = ['🌹','🌷','🌹','🥀','🌹','🌷'];
        flowers.forEach((f, k) => {
          const edge = k % 2 === 0 ? 'left' : 'right';
          placeEmoji('wm-flower', f, y + (Math.random() - .5) * 6, {
            edge, size: 20 + Math.random() * 6, durMin: 9, durRange: 5
          });
        });
      }

      // ماه فقط در پاراگراف ۰ و ۱
      if (m.i === 0 || m.i === 1) {
        const edge = m.i === 0 ? 'left' : 'right';
        placeEmoji('wm-moon', '🌙', y + (Math.random() - .5) * 6, {
          edge, size: 22 + Math.random() * 6, durMin: 10, durRange: 6
        });
      }

      // جرقه‌ی طلایی هرماینی
      if ([2, 3, 5, 8, 9, 11, 12, 13].includes(m.i)) {
        const edge = Math.random() < .5 ? 'left' : 'right';
        placeEmoji('wm-sparkle', '✨', y + (Math.random() - .5) * 7, {
          edge, size: 18 + Math.random() * 6, durMin: 6, durRange: 4
        });
      }

      // پاپیون
      if ([3, 6, 10, 11, 13].includes(m.i)) {
        const edge = Math.random() < .5 ? 'left' : 'right';
        placeEmoji('wm-ribbon', '🎀', y + (Math.random() - .5) * 7, {
          edge, size: 19 + Math.random() * 6, durMin: 9, durRange: 5
        });
      }
    });

    /* ---------- پروانه‌های پس‌زمینه‌ای ---------- */
    const bgButterflyCount = Math.round(5 * density);
    const bXs = stratify(bgButterflyCount, 5, 93);
    const bYs = stratify(bgButterflyCount, 3, 94);
    for (let i = 0; i < bgButterflyCount; i++) {
      placeEmoji('wm-butterfly', '🦋', bYs[i], {
        size: 28 + Math.random() * 12,
        durMin: 10, durRange: 6
      });
      wm.lastChild.style.left = bXs[i] + '%';
    }

    /* ---------- ستاره‌ها ---------- */
    const starCount = Math.round(22 * density);
    const sXs = stratify(starCount, 2, 98);
    const sYs = stratify(starCount, 0, 100);
    for (let i = 0; i < starCount; i++) {
      placeStar(sXs[i], sYs[i]);
    }

    /* ---------- ذرات جادویی ---------- */
    const dotCount = Math.round(20 * density);
    const dXs = stratify(dotCount, 2, 98);
    const dYs = stratify(dotCount, 0, 100);
    for (let i = 0; i < dotCount; i++) {
      placeDot(dXs[i], dYs[i]);
    }
  }

  buildWatermark();
</script>

</body>
</html>
